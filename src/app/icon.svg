<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded square background -->
  <rect width="32" height="32" rx="7" fill="#080B0D"/>

  <!-- Cricket ball -->
  <circle cx="16" cy="16" r="11.5" fill="#64D38A"/>

  <!-- Depth shading -->
  <circle cx="16" cy="16" r="11.5" fill="url(#g)"/>

  <!-- Left seam curve -->
  <path d="M16 4.5 C9 5.5 5 10 4.5 16 C5 22 9 26.5 16 27.5"
        fill="none" stroke="#2B8A5B" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Right seam curve -->
  <path d="M16 4.5 C23 5.5 27 10 27.5 16 C27 22 23 26.5 16 27.5"
        fill="none" stroke="#2B8A5B" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Left stitches -->
  <g stroke="#1a5e3e" stroke-width="0.9" stroke-linecap="round">
    <line x1="8.5"  y1="9.5"  x2="7"   y2="8.2"/>
    <line x1="6.5"  y1="13"   x2="4.8" y2="12.3"/>
    <line x1="5.2"  y1="16.8" x2="3.5" y2="16.8"/>
    <line x1="6.5"  y1="20.5" x2="4.8" y2="21.2"/>
    <line x1="8.5"  y1="23.5" x2="7"   y2="24.8"/>
  </g>

  <!-- Right stitches -->
  <g stroke="#1a5e3e" stroke-width="0.9" stroke-linecap="round">
    <line x1="23.5" y1="9.5"  x2="25"  y2="8.2"/>
    <line x1="25.5" y1="13"   x2="27.2" y2="12.3"/>
    <line x1="26.8" y1="16.8" x2="28.5" y2="16.8"/>
    <line x1="25.5" y1="20.5" x2="27.2" y2="21.2"/>
    <line x1="23.5" y1="23.5" x2="25"  y2="24.8"/>
  </g>

  <!-- Shine -->
  <ellipse cx="12" cy="11.5" rx="3" ry="2" fill="white" opacity="0.15" transform="rotate(-25 12 11.5)"/>

  <defs>
    <radialGradient id="g" cx="38%" cy="36%" r="65%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.22"/>
    </radialGradient>
  </defs>
</svg>
