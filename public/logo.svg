<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#080B0D"/>

  <!-- Cricket ball body -->
  <circle cx="100" cy="100" r="72" fill="#64D38A"/>

  <!-- Ball shading for depth -->
  <circle cx="100" cy="100" r="72" fill="url(#shade)"/>

  <!-- Main seam - left curve -->
  <path d="M100 28 C60 35 32 65 28 100 C32 135 60 165 100 172"
        fill="none" stroke="#2B8A5B" stroke-width="4" stroke-linecap="round"/>

  <!-- Main seam - right curve -->
  <path d="M100 28 C140 35 168 65 172 100 C168 135 140 165 100 172"
        fill="none" stroke="#2B8A5B" stroke-width="4" stroke-linecap="round"/>

  <!-- Seam stitches - left side -->
  <g stroke="#1a5e3e" stroke-width="2.5" stroke-linecap="round">
    <line x1="52" y1="58"  x2="46" y2="52"/>
    <line x1="44" y1="72"  x2="37" y2="68"/>
    <line x1="38" y1="88"  x2="30" y2="86"/>
    <line x1="36" y1="105" x2="28" y2="104"/>
    <line x1="38" y1="120" x2="30" y2="122"/>
    <line x1="44" y1="134" x2="37" y2="138"/>
    <line x1="52" y1="146" x2="46" y2="152"/>
  </g>

  <!-- Seam stitches - right side -->
  <g stroke="#1a5e3e" stroke-width="2.5" stroke-linecap="round">
    <line x1="148" y1="58"  x2="154" y2="52"/>
    <line x1="156" y1="72"  x2="163" y2="68"/>
    <line x1="162" y1="88"  x2="170" y2="86"/>
    <line x1="164" y1="105" x2="172" y2="104"/>
    <line x1="162" y1="120" x2="170" y2="122"/>
    <line x1="156" y1="134" x2="163" y2="138"/>
    <line x1="148" y1="146" x2="154" y2="152"/>
  </g>

  <!-- Shine highlight -->
  <ellipse cx="75" cy="72" rx="18" ry="12" fill="white" opacity="0.12" transform="rotate(-30 75 72)"/>

  <defs>
    <radialGradient id="shade" cx="40%" cy="38%" r="65%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
</svg>
